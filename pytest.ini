[pytest]
# 本机受限环境下 pytest 的缓存目录与内置 tmp_path 都会因 ACL 操作被拒绝（WinError 5），
# 因此这里**关闭 cacheprovider 插件**（-p no:cacheprovider），并由测试内的 `workdir`
# 夹具在项目内自建临时目录（见 tests/test_capability_service.py 顶部说明）。
# 注意：关闭插件后 cache_dir 配置项不再生效，因此这里不再声明 cache_dir。
pythonpath = .
testpaths = tests
addopts = -q --no-header -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
